<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SigmaView — Registro Prospectivo</title>
<style>
:root{
  color-scheme: light;
  --plane:#f9f9f7; --surface:#fcfcfb;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --rule:#c3c2b7; --border:rgba(11,11,11,.10);
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --accent:#2a78d6;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --plane:#0d0d0d; --surface:#1a1a19;
    --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --rule:#383835; --border:rgba(255,255,255,.10);
    --accent:#3987e5;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#0d0d0d; --surface:#1a1a19;
  --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --rule:#383835; --border:rgba(255,255,255,.10);
  --accent:#3987e5;
}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 72px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between;
  padding-bottom:16px;border-bottom:1px solid var(--rule);margin-bottom:24px}
h1{font-size:21px;margin:0;letter-spacing:-.01em}
h2{font-size:15px;margin:34px 0 12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2)}
.meta{color:var(--muted);font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.tile .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tile .v{font-size:30px;font-weight:600;margin-top:4px;letter-spacing:-.02em}
.tile .s{font-size:12px;color:var(--ink-2);margin-top:2px}
.banner{margin-top:16px;padding:13px 16px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface);border-left:3px solid var(--warning);font-size:14px;color:var(--ink-2)}
.banner b{color:var(--ink)}
.scroll{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;text-transform:uppercase;
  letter-spacing:.05em;padding:10px 12px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--grid);white-space:nowrap}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
.dim{color:var(--muted)}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11px;font-weight:600;
  border:1px solid var(--border);color:var(--ink-2)}
.tag.limpio{border-color:var(--accent);color:var(--accent)}
.long{color:var(--good);font-weight:600}
.short{color:var(--critical);font-weight:600}
.ok{color:var(--good);font-weight:600}
.bad{color:var(--critical);font-weight:600}
.warn{color:var(--serious);font-weight:600}
.note{font-size:12.5px;color:var(--muted);margin-top:9px}
footer{margin-top:44px;padding-top:14px;border-top:1px solid var(--rule);
  font-size:12.5px;color:var(--muted)}
code{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Registro Prospectivo — SigmaView</h1>
      <div class="meta" id="sub">cargando…</div>
    </div>
    <div class="meta" id="stamp"></div>
  </header>
  <main id="app"><p class="dim">Cargando datos…</p></main>
  <footer>
    Fuente de verdad: <code>data/predicciones_prospectivas.jsonl</code> (append-only, versionado en git).
    Esta página lee <code>data/prospectivo.json</code>, derivado del log.
    Una predicción registrada nunca se edita — solo se resuelve.
  </footer>
</div>

<script>
const $ = (h) => { const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content; };
const pct = (v) => v==null ? '—' : v.toFixed(0)+'%';
const money = (v) => v==null ? '—' : (Math.abs(v)>=100 ? v.toLocaleString('es',{maximumFractionDigits:0})
                                                       : v.toLocaleString('es',{maximumFractionDigits:2}));

fetch('data/prospectivo.json?_=' + Date.now())
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(render)
  .catch(e => document.getElementById('app').innerHTML =
    `<p class="bad">No se pudo cargar data/prospectivo.json (${e}). Corre <code>python3 src/prospectivo.py sync</code>.</p>`);

function render(d){
  const R = d.resumen, TL = R.tests_limpios;
  document.getElementById('sub').textContent =
    `${R.total} predicciones · ${R.vivas} vivas · método ${d.metodo_version_actual}`;
  document.getElementById('stamp').textContent = `datos al ${d.fecha}`;

  const app = document.getElementById('app');
  app.innerHTML = '';

  // ── KPIs ──────────────────────────────────────────────────────────────────
  const brier = R.calibracion.brier;
  app.append($(`<section class="tiles">
    <div class="tile"><div class="k">Vivas</div><div class="v">${R.vivas}</div>
      <div class="s">de ${R.total} registradas</div></div>
    <div class="tile"><div class="k">Resueltas</div><div class="v">${R.resueltas}</div>
      <div class="s">meta: 20–30 en una misma versión</div></div>
    <div class="tile"><div class="k">Tests limpios</div>
      <div class="v">${TL.resueltos}<span class="dim" style="font-size:17px">/${TL.registrados}</span></div>
      <div class="s">resueltos / registrados</div></div>
    <div class="tile"><div class="k">Brier score</div>
      <div class="v">${brier==null?'—':brier.toFixed(3)}</div>
      <div class="s">${brier==null?'sin datos':(brier<0.25?'mejor que azar':'peor que declarar 0.5')}</div></div>
  </section>`));

  if (TL.resueltos === 0) app.append($(`<div class="banner">
    <b>⚠ Aún no hay evidencia sobre el edge de Elliott.</b> Solo las predicciones que
    <b>contradicen</b> al baseline naive (seguir-tendencia) miden si el método aporta algo;
    hay ${TL.registrados} registradas y ninguna ha vencido. Las que coinciden con el naive miden
    el sistema completo, no Elliott.</div>`));

  // ── Señales vivas ─────────────────────────────────────────────────────────
  const hoy = new Date(d.fecha);
  const vivas = d.predicciones.filter(p => p.resultado == null).map(p => {
    const px = d.precios[p.activo];
    const dObj = px ? Math.abs(px - p.objetivo)/px*100 : null;
    const dInv = px ? Math.abs(px - p.invalidacion)/px*100 : null;
    const dias = Math.round((new Date(p.horizonte_fecha) - hoy)/864e5);
    return {p, px, dObj, dInv, dias, prox: Math.min(dObj ?? 999, dInv ?? 999)};
  }).sort((a,b) => a.prox - b.prox);

  app.append($(`<h2>Señales vivas (${vivas.length})</h2>`));
  const rows = vivas.map(({p,px,dObj,dInv,dias}) => {
    const limpio = p.direccion !== p.benchmark_naive_dir;
    const cerca = Math.min(dObj ?? 999, dInv ?? 999) < 5;
    return `<tr>
      <td><b>${p.activo}</b>${limpio?' <span class="tag limpio">test limpio</span>':''}</td>
      <td><span class="tag">${p.metodo_version}</span></td>
      <td class="${p.direccion==='LONG'?'long':'short'}">${p.direccion}</td>
      <td class="num">${money(px)}</td>
      <td class="num">${money(p.objetivo)} <span class="dim">${pct(dObj)}</span></td>
      <td class="num">${money(p.invalidacion)} <span class="dim">${pct(dInv)}</span></td>
      <td class="num">${p.confianza.toFixed(2)}</td>
      <td class="num ${dias<14?'warn':''}">${dias}d</td>
      <td>${cerca?'<span class="warn">◆ cerca</span>':'<span class="dim">—</span>'}</td>
    </tr>`;}).join('');
  app.append($(`<div class="scroll"><table>
    <thead><tr><th>Activo</th><th>Ver</th><th>Dir</th><th class="num">Precio</th>
      <th class="num">Objetivo</th><th class="num">Invalidación</th><th class="num">Conf</th>
      <th class="num">Horiz</th><th>Estado</th></tr></thead><tbody>${rows}</tbody></table></div>`));
  app.append($(`<p class="note">Ordenadas por proximidad al gatillo. <b>◆ cerca</b> = a menos de 5% de
    resolverse. <b>test limpio</b> = la lectura contradice al momentum, único caso que mide Elliott.</p>`));

  // ── Edge y calibración ────────────────────────────────────────────────────
  const CN = R.coinciden_naive, cal = R.calibracion;
  app.append($(`<h2>¿Aporta algo el método?</h2>
  <div class="scroll"><table>
    <thead><tr><th>Cubeta</th><th class="num">Registradas</th><th class="num">Resueltas</th>
      <th class="num">Acierto</th><th>Qué mide</th></tr></thead>
    <tbody>
      <tr><td><b>Contradicen al naive</b></td><td class="num">${TL.registrados}</td>
        <td class="num">${TL.resueltas}</td><td class="num">${pct(TL.pct)}</td>
        <td>Si <b>Elliott</b> aporta sobre el momentum</td></tr>
      <tr><td>Coinciden con el naive</td><td class="num">${R.total-TL.registrados}</td>
        <td class="num">${CN.resueltas}</td><td class="num">${pct(CN.pct)}</td>
        <td class="dim">El sistema completo, no Elliott</td></tr>
    </tbody></table></div>
  <p class="note">Umbrales pre-comprometidos sobre tests limpios (n=20):
    <b>≥13</b> aporta · <b>10–12</b> sin edge · <b>≤9</b> dañino.
    Calibración: confianzas entre ${cal.conf_min} y ${cal.conf_max}
    (dispersión ${cal.dispersion})${cal.dispersion < 0.25 ?
      ' — <span class="warn">insuficiente para construir una curva</span>' : ''}.</p>`));

  // ── Por versión ───────────────────────────────────────────────────────────
  const pv = Object.entries(R.por_version).map(([v,s]) =>
    `<tr><td><b>${v}</b></td><td class="num">${s.registradas}</td><td class="num">${s.resueltas}</td>
     <td class="num">${pct(s.pct)}</td><td class="dim">${(d.metodo_historial[v]||'').slice(0,96)}…</td></tr>`).join('');
  app.append($(`<h2>Por versión del método</h2>
  <div class="scroll"><table><thead><tr><th>Ver</th><th class="num">Registradas</th>
    <th class="num">Resueltas</th><th class="num">Acierto</th><th>Qué cambió</th></tr></thead>
    <tbody>${pv}</tbody></table></div>
  <p class="note">No comparar entre versiones: son prompts distintos. Congelar y acumular muestra
    dentro de una versión antes de concluir nada.</p>`));

  // ── Historial ─────────────────────────────────────────────────────────────
  const res = d.predicciones.filter(p => p.resultado === 'acierto' || p.resultado === 'fallo');
  if (res.length){
    const hr = res.map(p => `<tr>
      <td>${p.ts_resolucion||''}</td><td><b>${p.activo}</b></td>
      <td><span class="tag">${p.metodo_version}</span></td>
      <td class="${p.direccion==='LONG'?'long':'short'}">${p.direccion}</td>
      <td class="${p.resultado==='acierto'?'ok':'bad'}">${p.resultado==='acierto'?'✓ acierto':'✗ fallo'}</td>
      <td class="num">${money(p.precio_resolucion)}</td>
      <td class="num">${p.confianza.toFixed(2)}</td>
      <td>${p.direccion!==p.benchmark_naive_dir?'<span class="tag limpio">test limpio</span>':'<span class="dim">coincide</span>'}</td>
    </tr>`).join('');
    app.append($(`<h2>Historial resuelto (${res.length})</h2>
      <div class="scroll"><table><thead><tr><th>Fecha</th><th>Activo</th><th>Ver</th><th>Dir</th>
      <th>Resultado</th><th class="num">Precio</th><th class="num">Conf</th><th>Tipo</th></tr></thead>
      <tbody>${hr}</tbody></table></div>`));
  }
}
</script>
</body>
</html>
